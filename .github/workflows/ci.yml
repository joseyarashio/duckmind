name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests

  tests:
    # The suite takes about an hour on one runner, so the test files are dealt round-robin
    # (sorted by name) into four shards that run side by side. Public repositories only: there
    # Actions minutes are free; a private copy runs lint and the secrets scan (owner, 2026-11-05).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --extra dev
      - name: Tests, shard ${{ matrix.shard }} of 4 (without the physics simulator; those tests skip)
        run: |
          files=$(python3 -c "import glob; f = sorted(glob.glob('tests/test_*.py')); print(' '.join(f[${{ matrix.shard }}::4]))")
          # a test still running after 10 min prints every thread's stack (a hang shows where it waits)
          uv run pytest -q -p no:cacheprovider -o faulthandler_timeout=600 $files

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
