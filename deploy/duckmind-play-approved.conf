# Install only during a controlled, physically supervised bench trial; retain
# for later play only after the head motion checklist passes and is reviewed.
# Replace REPLACE_WITH_CURRENT_RELEASE_ID with the exact installed release ID.
# A stale ID after upgrade/rollback keeps real play locked.
# Place at /etc/systemd/system/duckmind.service.d/play-approved.conf, then
# systemctl daemon-reload && systemctl restart duckmind.service.
[Service]
ExecStart=
ExecStart=/opt/duckmind/current/venv/bin/duckmindd --state /var/lib/duckmind/duckmind.sqlite3 --socket /run/duckmind/duckmind.sock --robotd /run/robotd.sock --backend real --identity duck --approve-real-v5-head-profile --approved-release-id REPLACE_WITH_CURRENT_RELEASE_ID
